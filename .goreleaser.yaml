# GoReleaser config for dari-cli.
# Docs: https://goreleaser.com

version: 2

project_name: dari

before:
  hooks:
    - go mod tidy

builds:
  - id: dari
    main: ./cmd/dari
    binary: dari
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - README*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256
  # One checksum file covers the CLI and gateway archives: CLIs before the
  # repository merge verify updates with the release's only *_checksums.txt.
  extra_files:
    - glob: ./packages/gateway/release/*.tar.gz

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: mupt-ai
    name: dari
  # The gateway binaries ship in the same release as the CLI that installs
  # them; the release workflow compiles them before this runs.
  extra_files:
    - glob: ./install.sh
    - glob: ./packages/gateway/release/*.tar.gz
  draft: false
  prerelease: auto

# Copy to dari-gateway.yaml and point DARI_GATEWAY_CONFIG at it.
#
# Each router is an endpoint: `default` serves /v1/..., any other router
# serves /<router>/v1/.... Clients send `model: dari/routing` to let the
# router choose, or `model: dari/model/<id>` to pin one of its models.
routers:
  default:
    models:
      - anthropic/claude-sonnet-5-5
      - id: openai/gpt-6.1-sol
        thinking: [medium, high]
    # A coding agent's own list, served to it in place of `models`. Agents
    # are claude_code, codex, muse_code, opencode, pi, openclaw, and hermes.
    # agentModels:
    #   codex:
    #     - openai/gpt-6.1-sol
    #     - openai/gpt-6.1-terra
    # Serve with connected Claude Code / ChatGPT subscriptions before API
    # keys (default true).
    subscriptions: true
    # Route each session's first turn, then keep that model for the whole
    # session; each subagent is routed once on its own (default false).
    sessionPinning: false
    # Serve an agent role one of the router's models without routing: the
    # main agent, and subagents (including workflow agents). A role left out
    # is routed; background work keeps its own routing.
    # roleModels:
    #   main: anthropic/claude-fable-5-2
    #   subagent: openai/gpt-6.1-terra
    # Append text to the end of a role's system prompt, for example to nudge
    # the main agent to delegate. Background work never gets it.
    # rolePrompts:
    #   main: Delegate codebase exploration and independent edits to subagents.
    # Let Codex compact context server-side with the provider's native
    # compaction; requests carrying compaction state are routed only to
    # models that support it (default false).
    nativeCompaction: false

  local:
    models:
      - local/qwen3-coder

# Endpoints for providers outside the built-in catalog, such as vLLM, Ollama,
# or any OpenAI-compatible server.
providers:
  local:
    baseUrl: http://localhost:8000/v1
    # api: openai-completions   # or anthropic-messages, openai-responses
    # apiKeyEnv: LOCAL_API_KEY

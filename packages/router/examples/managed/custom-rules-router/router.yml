name: Example Custom Rules Router
enabled_models:
  - openai/gpt-6.1-sol
  - deepseek-ai/DeepSeek-V4.1-Flash-1017
model_providers:
  openai/gpt-6.1-sol: openai
  deepseek-ai/DeepSeek-V4.1-Flash-1017: fireworks
model_thinking_levels:
  openai/gpt-6.1-sol: [low, medium, high]
  deepseek-ai/DeepSeek-V4.1-Flash-1017: [off]
provider_key_sources:
  openai: managed
  fireworks: managed
custom_config:
  rules:
    - when: planning, architecture, or difficult debugging
      use: openai/gpt-6.1-sol
      thinking_level: high
    - when: short questions and straightforward implementation
      use: deepseek-ai/DeepSeek-V4.1-Flash-1017
      thinking_level: off
role_models:
  main: null
  subagent: deepseek-ai/DeepSeek-V4.1-Flash-1017
